
services:
  floci:
    image: floci/floci:latest
    container_name: supporthub-floci
    ports:
      # Loopback only. Floci accepts its default admin credentials and serves
      # unsigned S3 reads, so it must never be reachable from the LAN/tailnet.
      # Containers reach it as http://floci:4566 on the Docker network.
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
    volumes:
      - floci-data:/app/data
      # ECS tasks (the three workers) and the Lambda run as sibling containers,
      # so Floci needs the Docker socket. Floci itself stays loopback-only.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  article-service:
    build:
      context: ../../services/article-service
    image: supporthub-article-service:local
    container_name: supporthub-article
    ports:
      - "3005:3001"
    env_file:
      - ../../services/article-service/.env
    environment:
      PORT: "3001"
      NODE_ENV: production
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_SECRET_NAME: supporthub/article/runtime-config
    depends_on:
      floci:
        condition: service_started
    restart: unless-stopped

  article-outbox-worker:
    build:
      context: ../../services/article-service
    image: supporthub-article-service:local
    container_name: supporthub-article-outbox-worker
    command: ["node", "services/articleOutboxScheduler.js"]
    env_file:
      - ../../services/article-service/.env
    environment:
      SQS_QUEUE_URL: http://floci:4566/000000000000/supporthub-article-events-demo
      NODE_ENV: production
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_SECRET_NAME: supporthub/article/runtime-config
    depends_on:
      floci:
        condition: service_started
    restart: unless-stopped

  identity-service:
    build:
      context: ../../services/identity-service
    image: supporthub-identity-service:local
    container_name: supporthub-identity
    ports:
      - "3006:3003"
    env_file:
      - ../../services/identity-service/.env
    environment:
      PORT: "3003"
      NODE_ENV: ${IDENTITY_NODE_ENV:-development}
    restart: unless-stopped

volumes:
  floci-data:

