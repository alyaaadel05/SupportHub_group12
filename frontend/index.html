
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportHub | Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>SupportHub</h1>
    <nav id="navigation">
      <a href="index.html">Home</a>
      <a href="articles.html">Articles</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>How can we help you?</h2>
      <p>Find answers to your questions in our knowledge base.</p>

      <form id="search-form">
        <label for="search-input">Search help articles</label>
        <input id="search-input" type="search"
               placeholder="Search for help..." required>
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="content">
      <h2>Browse Help Articles</h2>
      <p>Explore our support articles and helpful guides.</p>
      <a class="btn" href="articles.html">View All Articles</a>
    </section>
  </main>

  <footer>© 2026 SupportHub - Group 12</footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.querySelector("#search-form").addEventListener(
      "submit", function(event) {
        event.preventDefault();
        const text = document.querySelector("#search-input").value.trim();
        if (text) {
          window.location.href =
            "articles.html?q=" + encodeURIComponent(text);
        }
      }
    );
  </script>
</body>
</html>
