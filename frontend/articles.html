
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportHub | Articles</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>SupportHub</h1>
    <nav id="navigation">
      <a href="index.html">Home</a>
      <a href="articles.html">Articles</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="page">
    <section class="panel">
      <h2>Help Articles</h2>
      <p>Find answers and solutions to common problems.</p>

      <form id="article-search" class="search-row">
        <input id="article-query" type="search"
               placeholder="Search published articles">
        <button type="submit">Search</button>
      </form>

      <label for="category-filter">Category</label>
      <select id="category-filter">
        <option value="">All Categories</option>
      </select>

      <div id="articles-list" class="article-grid"></div>
      <p id="article-message" role="status"></p>
    </section>
  </main>

  <footer>© 2026 SupportHub - Group 12</footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/articles.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"
          async defer></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportHub | Analytics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>SupportHub</h1>
    <nav id="navigation"></nav>
  </header>

  <main class="page">
    <section class="panel">
      <h2>Knowledge Base Analytics</h2>
      <div id="analytics-summary" class="stats-grid"></div>
      <p id="analytics-message" role="status"></p>
    </section>

    <section class="panel">
      <h2>Article Performance</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Article</th>
              <th>Views</th>
              <th>Helpful</th>
              <th>Not Helpful</th>
            </tr>
          </thead>
          <tbody id="article-performance"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Popular Search Terms</h2>
      <div id="popular-searches"></div>
    </section>
  </main>

  <footer>© 2026 SupportHub - Group 12</footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
