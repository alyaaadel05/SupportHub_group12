
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SupportHub | Analytics</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Header -->
    <header class="header">

        <h1>SupportHub</h1>

        <nav id="navigation">
            <a href="index.html">Home</a>
            <a href="articles.html">Articles</a>
            <a href="login.html">Login</a>
        </nav>

    </header>

    <!-- Main Content -->
    <main class="page">

        <!-- Analytics Summary -->
        <section class="panel">

            <h2>Knowledge Base Analytics</h2>

            <div id="analytics-summary"
                 class="stats-grid">
            </div>

            <p id="analytics-message"
               class="message"
               role="status">
            </p>

        </section>

        <!-- Article Performance -->
        <section class="panel">

            <h2>Article Performance</h2>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Article</th>
                            <th>Views</th>
                            <th>Helpful</th>
                            <th>Not Helpful</th>
                        </tr>
                    </thead>

                    <tbody id="article-performance">
                    </tbody>

                </table>

            </div>

        </section>

        <!-- Popular Search Terms -->
        <section class="panel">

            <h2>Popular Search Terms</h2>

            <div id="popular-searches">
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SupportHub - Group 12</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/analytics.js"></script>

</body>
</html>
