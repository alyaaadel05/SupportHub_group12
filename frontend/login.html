
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SupportHub | Login</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header">
    <h1>SupportHub</h1>

    <nav id="navigation">
      <a href="index.html">Home</a>
      <a href="articles.html">Articles</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="page">

    <div class="two-columns">

      <!-- LOGIN SECTION -->
      <section class="panel">
        <h2>Login</h2>

        <form id="login-form">

          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            required
          >

          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            required
          >

          <button type="submit">
            Login
          </button>

        </form>
      </section>

      <!-- REGISTRATION SECTION -->
      <section class="panel">
        <h2>Create an Account</h2>

        <form id="register-form">

          <label for="register-name">
            Full Name
          </label>
          <input
            type="text"
            id="register-name"
            name="name"
            minlength="2"
            maxlength="100"
            autocomplete="name"
            required
          >

          <label for="register-email">
            Email
          </label>
          <input
            type="email"
            id="register-email"
            name="email"
            autocomplete="email"
            required
          >

          <label for="register-password">
            Password
          </label>
          <input
            type="password"
            id="register-password"
            name="password"
            minlength="12"
            autocomplete="new-password"
            required
          >

          <p class="muted">
            Use at least 12 characters for your password.
          </p>

          <!-- Cloudflare Turnstile -->
          <div id="registration-turnstile"></div>

          <button type="submit">
            Register
          </button>

        </form>
      </section>

    </div>

    <!-- Authentication messages -->
    <p
      id="auth-message"
      class="message"
      role="status"
      aria-live="polite"
    ></p>

  </main>

  <footer>
    © 2026 SupportHub - Group 12
  </footer>

  <!-- Configuration must load before authentication -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
